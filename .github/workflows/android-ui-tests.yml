name: Android UI tests

on:
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ui-tests.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ui-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-tests:
    # Linux + KVM is the supported path for hardware-accelerated emulators.
    # macOS runners frequently hit "Timeout waiting for emulator to boot"
    # (adb kill then fails with connection refused on 5554).
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Espresso tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot
            -camera-back none
          disable-animations: true
          working-directory: ./mobile
          script: bash scripts/run-android-ui-tests.sh
