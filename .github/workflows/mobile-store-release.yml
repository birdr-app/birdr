# Build & submit mobile store releases via EAS.
#
# Builds run on Expo's servers (ubuntu runner only triggers them — no macOS minutes).
# One-time setup: see mobile/README.md → "Automated store releases (GitHub Actions)".
name: Mobile store release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and submit
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      submit:
        description: Auto-submit to App Store Connect / Play Console after build
        required: true
        type: boolean
        default: true

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Sync iOS Info.plist versions from app.json
        run: npm run sync-release

      - name: Build and submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PLATFORM="${{ inputs.platform }}"
          ARGS=(--platform "$PLATFORM" --profile production --non-interactive)
          if [ "${{ inputs.submit }}" = "true" ]; then
            ARGS+=(--auto-submit)
          fi
          echo "Running: eas build ${ARGS[*]}"
          eas build "${ARGS[@]}"
