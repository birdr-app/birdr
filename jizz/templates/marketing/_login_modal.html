<dialog
  id="login-dialog"
  class="login-dialog"
  aria-labelledby="login-dialog-title"
>
  <div class="login-dialog-panel">
    <button type="button" class="login-dialog-close js-close-login" aria-label="{% mt "Close" %}">&times;</button>
    <h2 id="login-dialog-title">{% mt "Log in" %}</h2>
    <p class="form-error" id="login-error" hidden></p>
    <p class="form-note" id="login-info" hidden></p>

    <form id="login-form" class="login-form">
      <p id="login-username-wrap" hidden>
        <label for="login-username">{% mt "Username" %}</label>
        <input id="login-username" name="username" type="text" autocomplete="username">
      </p>
      <p>
        <label for="login-email">{% mt "Email" %}</label>
        <input id="login-email" name="email" type="email" required autocomplete="email">
      </p>
      <p id="login-password-wrap">
        <label for="login-password">{% mt "Password" %}</label>
        <input id="login-password" name="password" type="password" required autocomplete="current-password">
        <button type="button" class="login-text-btn" id="login-forgot-link">{% mt "Forgot password?" %}</button>
      </p>
      <p>
        <button class="btn" type="submit" id="login-submit">{% mt "Log in" %}</button>
      </p>
      <p class="login-switch">
        <span id="login-switch-text">{% mt "Don't have an account?" %}</span>
        <button type="button" class="login-text-btn" id="login-switch">{% mt "Register" %}</button>
      </p>
    </form>

    <form id="forgot-form" class="login-form" hidden>
      <p>{% mt "Enter your email address and we'll send you a link to reset your password." %}</p>
      <p>
        <label for="forgot-email">{% mt "Email" %}</label>
        <input id="forgot-email" name="email" type="email" required autocomplete="email">
      </p>
      <p>
        <button class="btn" type="submit" id="forgot-submit">{% mt "Send reset link" %}</button>
      </p>
      <p class="login-switch">
        <button type="button" class="login-text-btn" id="login-back">{% mt "Back to login" %}</button>
      </p>
    </form>

    <div id="login-social">
      <p class="login-or">{% mt "Or continue with" %}</p>
      <button type="button" class="btn login-google" id="login-google">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#fff" d="M21.6 12.23c0-.74-.07-1.45-.19-2.13H12v4.04h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.98-4.33 2.98-7.43z"/>
          <path fill="#fff" d="M12 22c2.7 0 4.97-.9 6.63-2.34l-3.24-2.5c-.9.6-2.05.96-3.39.96-2.6 0-4.81-1.76-5.6-4.12H3.06v2.58A10 10 0 0 0 12 22z"/>
          <path fill="#fff" d="M6.4 13.99A6 6 0 0 1 6.08 12c0-.69.12-1.36.32-1.99V7.43H3.06A10 10 0 0 0 2 12c0 1.62.39 3.14 1.06 4.57l3.34-2.58z"/>
          <path fill="#fff" d="M12 5.88c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.96 2.9 14.7 2 12 2A10 10 0 0 0 3.06 7.43l3.34 2.58C7.19 7.64 9.4 5.88 12 5.88z"/>
        </svg>
        {% mt "Continue with Google" %}
      </button>
      <button type="button" class="btn secondary login-apple" id="login-apple">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M16.7 12.4c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.2c1.1-1.2 1.5-2.4 1.5-2.5-.1 0-2.8-1.1-2.8-4zM14.6 5.8c.6-.8 1.1-1.8 1-2.8-1 .1-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.8 1.1.1 2.1-.6 2.8-1.5z"/>
        </svg>
        {% mt "Continue with Apple" %}
      </button>
    </div>
  </div>
</dialog>
<script>
(function () {
  var AFTER_LOGIN = 'birdr_open_editor';
  var dialog = document.getElementById('login-dialog');
  var form = document.getElementById('login-form');
  var forgotForm = document.getElementById('forgot-form');
  var title = document.getElementById('login-dialog-title');
  var errorEl = document.getElementById('login-error');
  var infoEl = document.getElementById('login-info');
  var usernameWrap = document.getElementById('login-username-wrap');
  var usernameInput = document.getElementById('login-username');
  var emailInput = document.getElementById('login-email');
  var passwordWrap = document.getElementById('login-password-wrap');
  var passwordInput = document.getElementById('login-password');
  var submitBtn = document.getElementById('login-submit');
  var switchBtn = document.getElementById('login-switch');
  var switchText = document.getElementById('login-switch-text');
  var forgotLink = document.getElementById('login-forgot-link');
  var social = document.getElementById('login-social');
  var mode = 'login';
  var finishing = false;

  var i18n = window.BIRDR_I18N || {};
  function t(key) { return i18n[key] || key; }
    try {
      return localStorage.getItem('access_token') || localStorage.getItem('jw_token');
    } catch (e) {
      return null;
    }
  }

  function storeTokens(access, refresh) {
    try {
      localStorage.setItem('access_token', access);
      localStorage.setItem('jw_token', access);
      if (refresh) localStorage.setItem('refresh_token', refresh);
    } catch (e) {}
  }

  function captureOauthTokens() {
    try {
      var params = new URLSearchParams(window.location.search);
      var access = params.get('access_token');
      var refresh = params.get('refresh_token');
      var oauthError = params.get('error');
      var dirty = false;
      if (access && refresh) {
        storeTokens(access, refresh);
        params.delete('access_token');
        params.delete('refresh_token');
        dirty = true;
      }
      if (oauthError) {
        params.delete('error');
        dirty = true;
      }
      if (dirty) {
        var query = params.toString();
        window.history.replaceState({}, '', window.location.pathname + (query ? '?' + query : '') + window.location.hash);
      }
      return oauthError;
    } catch (e) {
      return null;
    }
  }

  function setMessage(el, text) {
    if (!el) return;
    if (text) {
      el.textContent = text;
      el.hidden = false;
    } else {
      el.textContent = '';
      el.hidden = true;
    }
  }

  function clearMessages() {
    setMessage(errorEl, '');
    setMessage(infoEl, '');
  }

  function apiError(data, fallback) {
    if (!data) return fallback;
    if (typeof data.detail === 'string') return data.detail;
    if (typeof data.error === 'string') return data.error;
    if (typeof data.message === 'string') return data.message;
    var keys = ['email', 'username', 'password', 'non_field_errors'];
    for (var i = 0; i < keys.length; i++) {
      var value = data[keys[i]];
      if (Array.isArray(value) && value[0]) return String(value[0]);
      if (typeof value === 'string' && value) return value;
    }
    return fallback;
  }

  function setMode(next) {
    mode = next;
    clearMessages();
    var isForgot = next === 'forgot';
    var isRegister = next === 'register';
    form.hidden = isForgot;
    forgotForm.hidden = !isForgot;
    social.hidden = isForgot;
    usernameWrap.hidden = !isRegister;
    usernameInput.required = isRegister;
    passwordWrap.hidden = isForgot;
    passwordInput.required = !isForgot;
    forgotLink.hidden = isRegister;
    if (isForgot) {
      title.textContent = t('Forgot password');
      document.getElementById('forgot-email').value = emailInput.value;
    } else if (isRegister) {
      title.textContent = t('Register');
      submitBtn.textContent = t('Register');
      switchText.textContent = t('Already have an account?');
      switchBtn.textContent = t('Log in');
    } else {
      title.textContent = t('Log in');
      submitBtn.textContent = t('Log in');
      switchText.textContent = t("Don't have an account?");
      switchBtn.textContent = t('Register');
    }
  }

  function openLogin() {
    if (!dialog || typeof dialog.showModal !== 'function') {
      window.location.href = '{{ login_href|escapejs }}';
      return;
    }
    setMode('login');
    dialog.showModal();
    if (emailInput) emailInput.focus();
  }

  function closeLogin() {
    if (!dialog) return;
    if (!finishing) {
      try { sessionStorage.removeItem(AFTER_LOGIN); } catch (e) {}
    }
    dialog.close();
  }

  function finishLogin(access, refresh) {
    finishing = true;
    storeTokens(access, refresh);
    window.location.reload();
  }

  function socialLogin(provider) {
    var redirectUri = window.location.origin + window.location.pathname + window.location.search;
    window.location.href = '/auth/login/' + provider + '/?redirect_uri=' + encodeURIComponent(redirectUri);
  }

  var oauthError = captureOauthTokens();

  function logout() {
    try {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      localStorage.removeItem('jw_token');
    } catch (e) {}
    window.location.href = '{{ logout_url|escapejs }}';
  }

  window.birdrAuth = {
    token: token,
    isLoggedIn: function () {
      return document.body.getAttribute('data-session-user') === '1' || !!token();
    },
    open: openLogin,
    close: closeLogin,
    logout: logout,
    afterLoginKey: AFTER_LOGIN
  };

  if (!dialog) return;

  document.querySelectorAll('.js-close-login').forEach(function (btn) {
    btn.addEventListener('click', closeLogin);
  });
  dialog.addEventListener('click', function (event) {
    if (event.target === dialog) closeLogin();
  });
  dialog.addEventListener('cancel', function () {
    if (!finishing) {
      try { sessionStorage.removeItem(AFTER_LOGIN); } catch (e) {}
    }
  });

  var navLogin = document.getElementById('nav-login');
  if (navLogin) {
    navLogin.setAttribute('aria-haspopup', 'dialog');
    navLogin.setAttribute('aria-controls', 'login-dialog');
    navLogin.addEventListener('click', function (event) {
      event.preventDefault();
      openLogin();
    });
  }

  switchBtn.addEventListener('click', function () {
    setMode(mode === 'login' ? 'register' : 'login');
  });
  forgotLink.addEventListener('click', function () { setMode('forgot'); });
  document.getElementById('login-back').addEventListener('click', function () { setMode('login'); });
  document.getElementById('login-google').addEventListener('click', function () {
    socialLogin('google-oauth2');
  });
  document.getElementById('login-apple').addEventListener('click', function () {
    socialLogin('apple-id');
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    clearMessages();
    if (mode === 'register' && passwordInput.value.length < 8) {
      setMessage(errorEl, t('Password must be at least 8 characters.'));
      return;
    }
    submitBtn.disabled = true;
    var payload;
    var url;
    if (mode === 'register') {
      url = '/api/register/';
      payload = {
        email: emailInput.value.trim(),
        password: passwordInput.value,
        username: usernameInput.value.trim() || emailInput.value.trim()
      };
    } else {
      url = '/token/';
      payload = {
        username: emailInput.value.trim(),
        password: passwordInput.value
      };
    }
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.json().then(function (data) {
        return { ok: res.ok, data: data };
      }).catch(function () {
        return { ok: res.ok, data: null };
      });
    }).then(function (result) {
      if (!result.ok) {
        setMessage(errorEl, apiError(result.data, t('Authentication failed. Please try again.')));
        return;
      }
      var access = result.data && (result.data.access || result.data.access_token);
      var refresh = result.data && (result.data.refresh || result.data.refresh_token);
      if (!access) {
        setMessage(errorEl, t('Authentication failed. Please try again.'));
        return;
      }
      finishLogin(access, refresh);
    }).catch(function () {
      setMessage(errorEl, t('Authentication failed. Please try again.'));
    }).finally(function () {
      submitBtn.disabled = false;
    });
  });

  forgotForm.addEventListener('submit', function (event) {
    event.preventDefault();
    clearMessages();
    var forgotBtn = document.getElementById('forgot-submit');
    forgotBtn.disabled = true;
    fetch('/api/password-reset/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('forgot-email').value.trim(),
        frontend_url: window.location.origin
      })
    }).then(function (res) {
      return res.json().then(function (data) {
        return { ok: res.ok, data: data };
      }).catch(function () {
        return { ok: res.ok, data: null };
      });
    }).then(function (result) {
      if (!result.ok) {
        setMessage(errorEl, apiError(result.data, t('Failed to send password reset email')));
        return;
      }
      setMessage(infoEl, t('If an account with this email exists, a password reset link has been sent.'));
    }).catch(function () {
      setMessage(errorEl, t('Failed to send password reset email'));
    }).finally(function () {
      forgotBtn.disabled = false;
    });
  });

  if (oauthError) {
    setMessage(errorEl, t('Authentication failed. Please try again.'));
    openLogin();
  }
})();
</script>
