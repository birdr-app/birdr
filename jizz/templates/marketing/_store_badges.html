<div class="store-badges">
  <a href="{{ app_store_url }}" rel="noopener noreferrer">
    <img
      src="{{ apple_badge_src }}"
      alt="{% mt "Download on the App Store" %}"
      height="40"
      width="120"
    >
  </a>
  <a class="play-badge" href="{{ play_store_url }}" rel="noopener noreferrer">
    <img
      src="{{ play_badge_src }}"
      alt="{% mt "Get it on Google Play" %}"
      height="40"
    >
  </a>
</div>
