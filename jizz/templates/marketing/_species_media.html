<dialog id="all-media" class="species-media-dialog"{% if species %} data-species-id="{{ species.id }}" data-species-name="{{ species_name }}" data-species-url="/api/species/{{ species.id }}/"{% endif %} aria-labelledby="species-media-title">
  <div class="species-media-panel">
    <div class="species-media-head">
      <h2 id="species-media-title">{% if species %}{{ species_name }}{% else %}{% mt "Media" %}{% endif %}</h2>
      <button type="button" class="species-media-close" data-close-species-media aria-label="{% mt "Close" %}">&times;</button>
    </div>
    <div class="species-media-tabs" role="tablist" aria-label="{% mt "Media type" %}">
      <button type="button" role="tab" data-media-tab="images" aria-selected="true">{% mt "Images" %}</button>
      <button type="button" role="tab" data-media-tab="videos" aria-selected="false">{% mt "Videos" %}</button>
      <button type="button" role="tab" data-media-tab="sounds" aria-selected="false">{% mt "Sounds" %}</button>
    </div>
    <div class="species-media-body" data-media-body>
      <p class="species-media-empty">{% mt "Loading…" %}</p>
    </div>
  </div>
</dialog>
<script>
(function () {
  var dialog = document.getElementById('all-media');
  if (!dialog || typeof dialog.showModal !== 'function') return;
  var body = dialog.querySelector('[data-media-body]');
  var tabs = dialog.querySelectorAll('[data-media-tab]');
  var titleEl = document.getElementById('species-media-title');
  var i18n = window.BIRDR_I18N || {};
  function t(key) { return i18n[key] || key; }
  var labels = { images: t('Images'), videos: t('Videos'), sounds: t('Sounds') };
  var cache = {};
  var currentUrl = '';
  var speciesName = dialog.getAttribute('data-species-name') || '';
  var data = null;
  var active = 'images';
  var loading = null;

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function youtubeId(url) {
    var match = String(url || '').match(
      /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/
    );
    return match ? match[1] : '';
  }

  function credit(item) {
    if (!item || !item.contributor) return '';
    return '<p class="credit">' + esc(item.contributor) + '</p>';
  }

  function renderItems(items, kind) {
    if (!items || !items.length) {
      var empty = {
        images: t('No images available'),
        videos: t('No videos available'),
        sounds: t('No sounds available')
      };
      return '<p class="species-media-empty">' + empty[kind] + '</p>';
    }
    return items.map(function (item) {
      var url = item && item.url;
      if (!url) return '';
      var inner = '';
      if (kind === 'images') {
        inner = '<img src="' + esc(url) + '" alt="' + esc(speciesName) + '">';
      } else if (kind === 'videos') {
        var yt = youtubeId(url);
        inner = yt
          ? '<iframe src="https://www.youtube.com/embed/' + esc(yt) + '" title="' + esc(t('Video')) + '" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>'
          : '<video controls src="' + esc(url) + '"></video>';
      } else {
        inner = '<audio controls src="' + esc(url) + '"></audio>';
      }
      return '<div class="species-media-item">' + inner + credit(item) + '</div>';
    }).join('');
  }

  function applyTabCounts(json) {
    tabs.forEach(function (tab) {
      var key = tab.getAttribute('data-media-tab');
      var count = json && json[key] ? json[key].length : null;
      tab.textContent = count == null ? labels[key] : labels[key] + ' (' + count + ')';
    });
  }

  function setTab(name) {
    active = name;
    tabs.forEach(function (tab) {
      tab.setAttribute('aria-selected', tab.getAttribute('data-media-tab') === name ? 'true' : 'false');
    });
    if (!data) return;
    body.innerHTML = renderItems(data[name] || [], name);
  }

  function load() {
    if (!currentUrl) return Promise.resolve();
    if (data) {
      applyTabCounts(data);
      setTab(active);
      return Promise.resolve();
    }
    if (loading) return loading;
    body.innerHTML = '<p class="species-media-empty">' + t('Loading…') + '</p>';
    loading = fetch(currentUrl)
      .then(function (res) {
        if (!res.ok) throw new Error('load failed');
        return res.json();
      })
      .then(function (json) {
        cache[currentUrl] = json;
        data = json;
        loading = null;
        applyTabCounts(json);
        setTab(active);
      })
      .catch(function () {
        loading = null;
        body.innerHTML = '<p class="species-media-empty">' + t('Could not load media. Try again later.') + '</p>';
      });
    return loading;
  }

  function openModal(event) {
    event.preventDefault();
    var el = event.currentTarget;
    var url = el.getAttribute('data-species-url') || dialog.getAttribute('data-species-url');
    var name = el.getAttribute('data-species-name') || dialog.getAttribute('data-species-name') || '';
    if (!url) return;
    if (url !== currentUrl) {
      currentUrl = url;
      speciesName = name;
      data = cache[url] || null;
      loading = null;
      active = 'images';
      if (!data) applyTabCounts(null);
      body.innerHTML = '<p class="species-media-empty">' + t('Loading…') + '</p>';
    }
    speciesName = name || speciesName;
    if (titleEl) titleEl.textContent = speciesName || t('Media');
    dialog.showModal();
    load();
  }

  document.querySelectorAll('[data-open-species-media]').forEach(function (el) {
    el.addEventListener('click', openModal);
  });
  dialog.querySelector('[data-close-species-media]').addEventListener('click', function () {
    dialog.close();
  });
  dialog.addEventListener('click', function (event) {
    if (event.target === dialog) dialog.close();
  });
  dialog.addEventListener('close', function () {
    dialog.querySelectorAll('video, audio').forEach(function (el) { el.pause(); });
  });
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      setTab(tab.getAttribute('data-media-tab'));
    });
  });
})();
</script>
