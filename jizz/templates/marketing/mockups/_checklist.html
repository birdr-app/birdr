{% load mt %}<div class="phone" role="img" aria-label="{% mt "My Checklist: species you have named correctly, and the ones still to learn" %}">
  <div class="phone-screen" aria-hidden="true">
    <div class="phone-bar">{% mt "My Checklist" %} <small>NL</small></div>
    <div class="phone-body">
      <div class="m-stat-row">
        <div class="m-stat"><div class="m-label">{% mt "Named" %}</div><b>286</b></div>
        <div class="m-stat"><div class="m-label">{% mt "To learn" %}</div><b>145</b></div>
      </div>
      <div class="m-check"><span class="box">&#10003;</span><b>Eurasian Spoonbill</b></div>
      <div class="m-check"><span class="box">&#10003;</span><b>Bluethroat</b></div>
      <div class="m-check"><span class="box">&#10003;</span><b>Black-tailed Godwit</b></div>
      <div class="m-check todo"><span class="box">&#10003;</span><b>Savi's Warbler</b></div>
      <div class="m-check todo"><span class="box">&#10003;</span><b>Spotted Crake</b></div>
      <div class="m-check"><span class="box">&#10003;</span><b>Bearded Reedling</b></div>
    </div>
  </div>
</div>
