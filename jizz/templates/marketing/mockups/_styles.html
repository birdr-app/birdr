<style>
  /* Home page: full-bleed hero, feature rows, Tody art and the phone mockups */
  .bleed {
    position: relative;
    box-shadow: 0 0 0 100vmax var(--bleed-bg);
    clip-path: inset(0 -100vmax);
    background: var(--bleed-bg);
  }
  .home-hero {
    --bleed-bg: var(--canopy-deep);
    color: var(--on-canopy-deep);
    padding: 48px 0 56px;
    margin: 0 0 24px;
  }
  .home-hero .hero-grid { grid-template-columns: 1.05fr 0.95fr; }
  .home-hero h1 { color: var(--on-canopy-deep); }
  .home-hero .kicker { color: var(--brow); }
  .home-hero .lead { color: var(--canopy-soft); }
  .home-hero .web-link { color: var(--canopy-soft); }
  .home-hero .web-link:hover { color: #FFFFFF; }
  .home-hero .btn { background: var(--sun); color: var(--ink); box-shadow: 0 3px 0 #B98A12; }
  .home-hero .btn:hover { background: #F8D266; color: var(--ink); }
  .hero-stage {
    position: relative;
    display: flex;
    justify-content: center;
    padding: 0 0 0 64px;
  }
  .hero-stage .tody {
    position: absolute;
    left: 0;
    bottom: -18px;
    width: 46%;
    max-width: 230px;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.28));
  }
  @media (max-width: 800px) {
    .home-hero .hero-grid { grid-template-columns: 1fr; }
    .hero-stage { padding: 0 0 0 40px; margin-top: 8px; }
    .hero-stage .tody { width: 40%; }
  }

  .tody { display: block; height: auto; pointer-events: none; }

  .intro-row {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 24px;
    align-items: center;
  }
  .intro-row .tody { width: 100%; max-width: 220px; justify-self: center; }
  @media (max-width: 700px) {
    .intro-row { grid-template-columns: 1fr; }
    .intro-row .tody { max-width: 160px; }
  }

  .steps .card { text-align: left; }
  .step-art { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 8px; }
  .step-art .tody { width: 92px; }
  .step-art .step-num { margin-bottom: 6px; }

  .features { display: grid; gap: 28px; margin-top: 28px; }
  .feature {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: center;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px;
    box-shadow: var(--shadow-ledge);
    overflow: hidden;
  }
  .feature:nth-child(even) .feature-art { order: -1; }
  .feature .kicker { margin-bottom: 6px; }
  .feature-title { font-family: var(--font); font-weight: 800; font-size: clamp(1.5rem, 2.6vw, 1.9rem); line-height: 1.1; margin: 0 0 10px; }
  .feature-text p { max-width: 34rem; }
  .feature-text .feature-more { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink-muted); }
  .feature-text .feature-more strong { color: var(--ink); }
  .feature-art {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 420px;
    border-radius: 22px;
    background: var(--feature-tint, var(--canopy-soft));
    padding: 28px 16px;
  }
  .feature-art .tody {
    position: absolute;
    right: -16px;
    bottom: -14px;
    width: 38%;
    max-width: 190px;
    filter: drop-shadow(0 8px 14px rgba(16, 32, 27, 0.18));
  }
  .feature:nth-child(even) .feature-art .tody { right: auto; left: -16px; }
  .feature.tint-brow { --feature-tint: #D9F3F8; }
  .feature.tint-ochre { --feature-tint: var(--ochre-soft); }
  .feature.tint-olive { --feature-tint: #EEF3D2; }
  @media (max-width: 800px) {
    .feature { grid-template-columns: 1fr; padding: 22px; gap: 22px; }
    .feature:nth-child(even) .feature-art { order: 0; }
    .feature-art { min-height: 0; padding: 24px 12px 36px; }
    .feature-art .tody { width: 34%; }
  }

  .download-band { position: relative; margin-top: 120px; }
  .download-band .tody-peek {
    position: absolute;
    right: 40px;
    top: -118px;
    width: 170px;
  }
  @media (max-width: 600px) {
    .download-band { margin-top: 96px; }
    .download-band .tody-peek { width: 130px; top: -90px; right: 20px; }
  }

  .quote-body { font-family: var(--ui); font-style: italic; }

  /* Phone mockup */
  .phone {
    position: relative;
    width: 252px;
    max-width: 100%;
    background: var(--ink);
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 22px 44px rgba(16, 32, 27, 0.22);
    font-family: var(--ui);
    font-size: 12px;
    line-height: 1.35;
    color: var(--ink);
    text-align: left;
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 18px;
    left: 50%;
    width: 72px;
    height: 20px;
    margin-left: -36px;
    border-radius: 12px;
    background: var(--ink);
    z-index: 2;
  }
  .phone-real { width: 260px; padding: 9px; }
  .phone-real::before { top: 17px; width: 76px; height: 22px; margin-left: -38px; }
  .phone-shot { display: block; width: 100%; height: auto; border-radius: 32px; }
  .phone-screen {
    background: var(--surface);
    border-radius: 31px;
    overflow: hidden;
    min-height: 470px;
    display: flex;
    flex-direction: column;
  }
  .phone-bar {
    background: var(--canopy);
    color: var(--on-canopy);
    padding: 44px 16px 12px;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .phone-bar small { font-weight: 500; opacity: 0.9; font-size: 11px; }
  .phone-body { padding: 12px; display: grid; gap: 8px; align-content: start; flex: 1; }
  .m-card {
    background: var(--surface-raised);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: inset 0 0 0 1.5px var(--line), 0 2px 0 var(--line);
  }
  .m-q { font-family: var(--font); font-weight: 800; font-size: 16px; line-height: 1.15; margin: 2px 0 4px; }
  .m-label { font-weight: 700; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .m-opt { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .m-opt b { font-weight: 600; font-size: 12.5px; }
  .m-opt i { display: block; font-size: 10.5px; color: var(--ink-muted); }
  .m-opt.is-correct { background: var(--correct-soft); box-shadow: inset 0 0 0 2px var(--correct); }
  .m-opt.is-correct .m-state { color: var(--correct); }
  .m-opt.is-wrong { background: var(--wrong-soft); box-shadow: inset 0 0 0 2px var(--wrong); }
  .m-opt.is-wrong .m-state { color: var(--wrong); }
  .m-state { display: block; font-weight: 700; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; }
  .m-mark {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 12px;
    color: #FFFFFF;
    background: var(--correct);
  }
  .is-wrong .m-mark { background: var(--wrong); }
  .m-wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 54px;
    padding: 0 4px;
  }
  .m-wave span { flex: 1; border-radius: 3px; background: var(--brow); }
  .m-wave span:nth-child(odd) { background: var(--brow-deep); }
  .m-play {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: var(--canopy);
    position: relative;
    margin-right: 6px;
  }
  .m-play::after {
    content: "";
    position: absolute;
    left: 14px;
    top: 11px;
    border-left: 11px solid #FFFFFF;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
  }
  .m-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .m-chip { border-radius: 999px; padding: 5px 10px; font-weight: 600; font-size: 11px; background: var(--surface-sunken); }
  .m-chip.on { background: var(--canopy); color: var(--on-canopy); }
  .m-btn {
    margin-top: auto;
    background: var(--canopy);
    color: var(--on-canopy);
    text-align: center;
    border-radius: 12px;
    padding: 10px;
    font-weight: 700;
    box-shadow: 0 3px 0 var(--canopy-deep);
  }
  .m-progress { height: 8px; border-radius: 999px; background: var(--surface-sunken); overflow: hidden; }
  .m-progress span { display: block; height: 100%; border-radius: 999px; background: var(--canopy); }
  .m-row { display: grid; grid-template-columns: 22px 26px 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; background: var(--surface-raised); }
  .m-row.me { background: var(--canopy-soft); box-shadow: inset 0 0 0 2px var(--canopy); }
  .m-rank { font-family: var(--font); font-weight: 800; font-size: 15px; text-align: center; font-variant-numeric: tabular-nums; }
  .m-medal { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: var(--sun); color: var(--ink); font-size: 12px; }
  .m-av { width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; font-weight: 700; font-size: 10px; background: var(--surface-sunken); }
  .m-pts { font-family: var(--font); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .m-you { font-weight: 700; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin-left: 4px; }
  .m-path { display: grid; gap: 6px; }
  .m-step { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: var(--surface-raised); font-weight: 600; }
  .m-step .dot { flex: none; width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; font-size: 11px; background: var(--surface-sunken); color: var(--ink-muted); }
  .m-step.done .dot { background: var(--canopy); color: var(--on-canopy); }
  .m-step.now { box-shadow: inset 0 0 0 2px var(--ochre); background: var(--ochre-soft); }
  .m-step.now .dot { background: var(--ochre); color: var(--ink); }
  .m-step.locked { color: var(--ink-muted); }
  .m-big { font-family: var(--font); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .m-center { text-align: center; }
  .m-timer { height: 8px; border-radius: 999px; background: var(--wrong-soft); overflow: hidden; }
  .m-timer span { display: block; height: 100%; width: 28%; background: var(--wrong); border-radius: 999px; }
  .m-pair { display: grid; gap: 4px; }
  .m-pair-names { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; }
  .m-pair-names em { font-style: normal; color: var(--ink-muted); }
  .m-count { display: inline-block; border-radius: 999px; padding: 2px 8px; font-weight: 700; font-size: 10px; background: var(--ochre); color: var(--ink); }
  .m-check { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; background: var(--surface-raised); }
  .m-check .box { flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--canopy); color: var(--on-canopy); }
  .m-check.todo .box { background: var(--surface-sunken); color: transparent; }
  .m-check.todo { color: var(--ink-muted); }
  .m-stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .m-stat { background: var(--surface-raised); border-radius: 12px; padding: 8px 10px; box-shadow: inset 0 0 0 1.5px var(--line); }
  .m-stat b { display: block; font-family: var(--font); font-weight: 800; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
