{% load mt %}<div class="phone" role="img" aria-label="{% mt "Survival: a streak of 23 correct answers, with the timer running low" %}">
  <div class="phone-screen" aria-hidden="true">
    <div class="phone-bar">{% mt "Survival" %} <small>{% mt "Pro" %}</small></div>
    <div class="phone-body">
      <div class="m-card m-center">
        <div class="m-label">{% mt "Streak" %}</div>
        <div class="m-big">23</div>
        <div class="m-label" style="margin-top: 4px">{% mt "Country record" %}: 31</div>
      </div>
      <div class="m-timer"><span></span></div>
      <div class="m-card"><div class="m-q" style="font-size: 14px">{% mt "Which bird is this?" %}</div>
        <div style="height: 92px; border-radius: 10px; background: linear-gradient(160deg, #9CC9A8, #3E7B5A 60%, #23523A);"></div></div>
      <div class="m-card m-opt"><b>Red-backed Shrike</b></div>
      <div class="m-card m-opt"><b>Lesser Grey Shrike</b></div>
    </div>
  </div>
</div>
