{% load mt %}<div class="phone" role="img" aria-label="{% mt "National League table for this week, with your own row highlighted in third place" %}">
  <div class="phone-screen" aria-hidden="true">
    <div class="phone-bar">{% mt "National League" %} <small>{% mt "This week" %}</small></div>
    <div class="phone-body">
      <div class="m-row"><span class="m-rank"><span class="m-medal">1</span></span><span class="m-av">AV</span><b>Anke</b><span class="m-pts">1,240</span></div>
      <div class="m-row"><span class="m-rank">2</span><span class="m-av">JB</span><b>Jeroen</b><span class="m-pts">1,185</span></div>
      <div class="m-row me"><span class="m-rank">3</span><span class="m-av">TM</span><b>Tody<span class="m-you">{% mt "You" %}</span></b><span class="m-pts">1,120</span></div>
      <div class="m-row"><span class="m-rank">4</span><span class="m-av">SM</span><b>Sanne</b><span class="m-pts">980</span></div>
      <div class="m-row"><span class="m-rank">5</span><span class="m-av">RK</span><b>Ruud</b><span class="m-pts">955</span></div>
      <div class="m-row"><span class="m-rank">6</span><span class="m-av">EW</span><b>Eva</b><span class="m-pts">910</span></div>
      <div class="m-card"><div class="m-label">{% mt "Today's quiz" %}</div><b>{% mt "Played" %} &#10003;</b> · {% mt "Next quiz tomorrow" %}</div>
    </div>
  </div>
</div>
