{% load mt %}<div class="phone" role="img" aria-label="{% mt "A flock's weekly game: four members, three have played" %}">
  <div class="phone-screen" aria-hidden="true">
    <div class="phone-bar">Sunday Birders <small>{% mt "This week" %}</small></div>
    <div class="phone-body">
      <div class="m-card"><div class="m-label">{% mt "This week's game" %}</div><b>{% mt "3 of 4 members played" %}</b>
        <div class="m-progress" style="margin-top: 6px"><span style="width: 75%"></span></div></div>
      <div class="m-row"><span class="m-rank"><span class="m-medal">1</span></span><span class="m-av">MK</span><b>Marieke</b><span class="m-pts">18</span></div>
      <div class="m-row me"><span class="m-rank">2</span><span class="m-av">TM</span><b>Tody<span class="m-you">{% mt "You" %}</span></b><span class="m-pts">16</span></div>
      <div class="m-row"><span class="m-rank">3</span><span class="m-av">PD</span><b>Pieter</b><span class="m-pts">14</span></div>
      <div class="m-row"><span class="m-rank">–</span><span class="m-av">LS</span><b>Lotte</b><span class="m-chip">{% mt "Not played yet" %}</span></div>
      <div class="m-btn">{% mt "Invite a friend" %}</div>
    </div>
  </div>
</div>
