{% load mt %}<div class="phone" role="img" aria-label="{% mt "Country Challenge for the Netherlands: three levels done, level 4 in progress" %}">
  <div class="phone-screen" aria-hidden="true">
    <div class="phone-bar">{% mt "Country Challenge" %} <small>NL</small></div>
    <div class="phone-body">
      <div class="m-card">
        <div class="m-label">{% mt "Species learned" %}</div>
        <div class="m-big" style="font-size: 30px">212 <small style="font-size: 14px">/ 431</small></div>
        <div class="m-progress"><span style="width: 49%"></span></div>
      </div>
      <div class="m-path">
        <div class="m-step done"><span class="dot">&#10003;</span>{% mt "Level" %} 1 · {% mt "Garden birds" %}</div>
        <div class="m-step done"><span class="dot">&#10003;</span>{% mt "Level" %} 2 · {% mt "Waterbirds" %}</div>
        <div class="m-step done"><span class="dot">&#10003;</span>{% mt "Level" %} 3 · {% mt "Raptors" %}</div>
        <div class="m-step now"><span class="dot">4</span>{% mt "Level" %} 4 · {% mt "Waders" %}</div>
        <div class="m-step locked"><span class="dot">5</span>{% mt "Level" %} 5</div>
        <div class="m-step locked"><span class="dot">6</span>{% mt "Level" %} 6</div>
      </div>
    </div>
  </div>
</div>
