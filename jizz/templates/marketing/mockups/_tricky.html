{% load mt %}<div class="phone" role="img" aria-label="{% mt "My Tricky Birds: the species pairs you mix up most, with a practice button" %}">
  <div class="phone-screen" aria-hidden="true">
    <div class="phone-bar">{% mt "My Tricky Birds" %}</div>
    <div class="phone-body">
      <div class="m-label">{% mt "Pairs you mix up" %}</div>
      <div class="m-card m-pair"><div class="m-pair-names">Common Chiffchaff <em>&harr;</em> Willow Warbler</div><span><span class="m-count">7&times;</span></span></div>
      <div class="m-card m-pair"><div class="m-pair-names">Marsh Tit <em>&harr;</em> Willow Tit</div><span><span class="m-count">5&times;</span></span></div>
      <div class="m-card m-pair"><div class="m-pair-names">Little Egret <em>&harr;</em> Great Egret</div><span><span class="m-count">4&times;</span></span></div>
      <div class="m-card m-pair"><div class="m-pair-names">Common Tern <em>&harr;</em> Arctic Tern</div><span><span class="m-count">4&times;</span></span></div>
      <div class="m-btn">{% mt "Practise these pairs" %}</div>
    </div>
  </div>
</div>
