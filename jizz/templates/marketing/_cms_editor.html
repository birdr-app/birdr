<style>
  .cms-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 80;
    display: none;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding: 10px 16px;
    background: #31220a;
    color: #f7f1e6;
    box-shadow: var(--shadow-bar);
  }
  .cms-bar.is-on { display: flex; }
  body.cms-bar-on { padding-bottom: 88px; }
  .cms-bar button, .cms-bar a, .cms-bar label {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .cms-bar button, .cms-bar a.cms-link {
    background: #fffdf8;
    color: #31220a;
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    text-decoration: none;
  }
  .cms-bar button.cms-primary {
    background: #f3d7a3;
  }
  .cms-bar input[type="text"] {
    width: 220px;
    max-width: 40vw;
    border: 0;
    border-radius: 8px;
    padding: 6px 8px;
    font: inherit;
  }
  .cms-bar .status { font-size: 0.85rem; opacity: 0.9; }
  .cms-page-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cms-editing [data-field="title"] {
    outline: 2px dashed #8b6419;
    outline-offset: 6px;
    min-height: 1.4em;
  }
  .cms-editing #cms-body {
    outline: 2px dashed #8b6419;
    outline-offset: 8px;
    min-height: 8em;
  }
</style>
{% include "includes/rich_text_editor.html" %}
<div class="cms-bar" id="cms-bar" data-slug="{{ cms_page.slug|default:'' }}">
  {% csrf_token %}
  <span id="cms-page-links" class="cms-page-links"></span>
  <button type="button" class="cms-primary" id="cms-edit">Edit</button>
  <button type="button" class="cms-primary" id="cms-save" hidden>Save</button>
  <button type="button" id="cms-cancel" hidden>Cancel</button>
  <button type="button" id="cms-new">New page</button>
  <label id="cms-meta-label">Meta <input type="text" id="cms-meta" maxlength="320" placeholder="Search description"></label>
  <label id="cms-published-label"><input type="checkbox" id="cms-published"> Published</label>
  <label id="cms-nav-label"><input type="checkbox" id="cms-nav"> In nav</label>
  <span class="status" id="cms-status"></span>
</div>
<script>
(function () {
  var bar = document.getElementById('cms-bar');
  if (!bar) return;
  var article = document.querySelector('.cms-page');
  var slug = bar.getAttribute('data-slug') || (article && article.getAttribute('data-slug')) || '';
  var titleEl = document.querySelector('[data-field="title"]');
  var bodyEl = document.querySelector('[data-field="body"]');
  var metaEl = document.getElementById('cms-meta');
  var publishedEl = document.getElementById('cms-published');
  var navEl = document.getElementById('cms-nav');
  var statusEl = document.getElementById('cms-status');
  var editBtn = document.getElementById('cms-edit');
  var saveBtn = document.getElementById('cms-save');
  var cancelBtn = document.getElementById('cms-cancel');
  var newBtn = document.getElementById('cms-new');
  var pageLinks = document.getElementById('cms-page-links');
  var snapshot = {};
  var canEditServer = {{ can_edit|default:False|yesno:"true,false" }};

  function token() {
    try {
      return localStorage.getItem('access_token') || localStorage.getItem('jw_token');
    } catch (e) {
      return null;
    }
  }
  function refreshToken() {
    try { return localStorage.getItem('refresh_token'); } catch (e) { return null; }
  }
  function csrf() {
    var el = document.querySelector('#cms-bar [name=csrfmiddlewaretoken]');
    if (el && el.value) return el.value;
    var m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function headers(json) {
    var h = {};
    if (json) h['Content-Type'] = 'application/json';
    var t = token();
    if (t) h['Authorization'] = 'Bearer ' + t;
    var c = csrf();
    if (c) h['X-CSRFToken'] = c;
    return h;
  }
  function setStatus(msg) { statusEl.textContent = msg || ''; }
  function showPageFields(on) {
    document.getElementById('cms-meta-label').hidden = !on;
    document.getElementById('cms-published-label').hidden = !on;
    document.getElementById('cms-nav-label').hidden = !on;
  }

  function bodyHtml() {
    var editor = window.tinymce && bodyEl && tinymce.get(bodyEl.id);
    if (editor) return editor.getContent();
    return bodyEl ? bodyEl.innerHTML : '';
  }

  function destroyBodyEditor() {
    if (!window.tinymce || !bodyEl) return;
    var editor = tinymce.get(bodyEl.id);
    if (editor) editor.remove();
  }

  function startBodyEditor() {
    if (!bodyEl || !window.BIRDR_RICH_TEXT) {
      if (bodyEl) bodyEl.contentEditable = 'true';
      return Promise.resolve();
    }
    return window.BIRDR_RICH_TEXT.load().then(function () {
      destroyBodyEditor();
      return tinymce.init(window.BIRDR_RICH_TEXT.options({
        selector: '#' + bodyEl.id,
        inline: true,
        toolbar_persist: true,
      })).then(function () {
        var editor = tinymce.get(bodyEl.id);
        if (editor) editor.focus();
      });
    }).catch(function () {
      if (bodyEl) bodyEl.contentEditable = 'true';
      setStatus('Could not load the formatting toolbar — you can still edit as plain HTML.');
    });
  }

  function setEditing(on) {
    document.body.classList.toggle('cms-editing', on);
    if (titleEl) titleEl.contentEditable = on ? 'true' : 'false';
    if (!on) {
      destroyBodyEditor();
      if (bodyEl) bodyEl.contentEditable = 'false';
    }
    editBtn.hidden = on || !slug;
    saveBtn.hidden = !on;
    cancelBtn.hidden = !on;
    showPageFields(!!slug);
    if (on) startBodyEditor();
  }

  function loadPage() {
    if (!slug) return Promise.resolve(null);
    return fetch('/api/marketing-pages/' + encodeURIComponent(slug) + '/', {
      headers: headers(false),
      credentials: 'same-origin'
    }).then(function (r) { return r.ok ? r.json() : null; });
  }

  function renderPageLinks(pages) {
    pageLinks.innerHTML = '';
    (pages || []).forEach(function (page) {
      var a = document.createElement('a');
      a.className = 'cms-link';
      a.href = '/site/page/' + encodeURIComponent(page.slug) + '/';
      a.textContent = 'Edit ' + (page.nav_label || page.title);
      if (page.slug === slug) a.setAttribute('aria-current', 'page');
      pageLinks.appendChild(a);
    });
  }

  function enableBar(page) {
    bar.classList.add('is-on');
    document.body.classList.add('cms-bar-on');
    editBtn.hidden = !slug;
    showPageFields(!!slug);
    if (page) {
      metaEl.value = page.meta_description || '';
      publishedEl.checked = !!page.published;
      navEl.checked = !!page.show_in_nav;
    }
  }

  function refreshAccess() {
    var refresh = refreshToken();
    if (!refresh) return Promise.resolve(null);
    return fetch('/token/refresh/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh: refresh })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
      if (!data || !data.access) return null;
      try {
        localStorage.setItem('access_token', data.access);
        localStorage.setItem('jw_token', data.access);
      } catch (e) {}
      return data.access;
    });
  }

  function loadStaffProfile() {
    return fetch('/api/profile/', { headers: headers(false), credentials: 'same-origin' })
      .then(function (r) {
        if (r.ok) return r.json();
        if (r.status !== 401) return null;
        return refreshAccess().then(function (access) {
          if (!access) return null;
          return fetch('/api/profile/', { headers: headers(false), credentials: 'same-origin' })
            .then(function (r2) { return r2.ok ? r2.json() : null; });
        });
      });
  }

  editBtn.addEventListener('click', function () {
    snapshot = {
      title: titleEl ? titleEl.innerText : '',
      body: bodyHtml(),
      meta: metaEl.value,
      published: publishedEl.checked,
      nav: navEl.checked
    };
    setEditing(true);
    setStatus('Editing — change the title or body, then Save.');
  });
  cancelBtn.addEventListener('click', function () {
    destroyBodyEditor();
    if (titleEl) titleEl.innerText = snapshot.title;
    if (bodyEl) bodyEl.innerHTML = snapshot.body;
    metaEl.value = snapshot.meta;
    publishedEl.checked = snapshot.published;
    navEl.checked = snapshot.nav;
    setEditing(false);
    setStatus('');
  });
  saveBtn.addEventListener('click', function () {
    if (!slug) return;
    setStatus('Saving…');
    fetch('/api/marketing-pages/' + encodeURIComponent(slug) + '/', {
      method: 'PATCH',
      credentials: 'same-origin',
      headers: headers(true),
      body: JSON.stringify({
        title: titleEl ? titleEl.innerText.trim() : '',
        body: bodyHtml(),
        meta_description: metaEl.value.trim(),
        published: publishedEl.checked,
        show_in_nav: navEl.checked
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('Save failed');
      return r.json();
    }).then(function () {
      setEditing(false);
      window.location.reload();
    }).catch(function () { setStatus('Could not save'); });
  });
  newBtn.addEventListener('click', function () {
    var title = window.prompt('New page title');
    if (!title) return;
    fetch('/api/marketing-pages/', {
      method: 'POST',
      credentials: 'same-origin',
      headers: headers(true),
      body: JSON.stringify({ title: title, published: true, body: '<p></p>' })
    }).then(function (r) {
      if (!r.ok) throw new Error('create');
      return r.json();
    }).then(function (page) {
      window.location.href = '/site/page/' + page.slug + '/';
    }).catch(function () { setStatus('Could not create page'); });
  });

  function start() {
    enableBar({});
    fetch('/api/marketing-pages/', { headers: headers(false), credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(renderPageLinks);
    loadPage().then(function (page) {
      if (page) enableBar(page);
      if (slug) {
        snapshot = {
          title: titleEl ? titleEl.innerText : '',
          body: bodyHtml(),
          meta: metaEl.value,
          published: publishedEl.checked,
          nav: navEl.checked
        };
        setEditing(true);
        setStatus('Editing — change the title or body, then Save.');
      }
    });
  }

  if (canEditServer) {
    start();
    return;
  }
  if (!token() && !refreshToken()) return;
  loadStaffProfile().then(function (profile) {
    if (!profile || !(profile.is_staff || profile.is_superuser)) return;
    start();
  });
})();
</script>
