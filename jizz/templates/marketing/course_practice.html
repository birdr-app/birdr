{% extends "marketing/base.html" %}
{% block extra_head %}
<style>
  .lesson-quiz { background: var(--card); border: 2px solid var(--canopy); border-radius: var(--radius-lg); padding: 20px; margin: 28px 0 0; }
  .lesson-kicker { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--canopy); margin: 0 0 6px; }
  .quiz-photo { border-radius: 16px; overflow: hidden; background: var(--surface-sunken); aspect-ratio: 4 / 3; max-width: 560px; }
  .quiz-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .quiz-sound { display: grid; justify-items: center; gap: 10px; background: var(--surface-sunken); border-radius: 16px; padding: 24px; max-width: 560px; }
  .quiz-options { display: grid; gap: 8px; max-width: 560px; margin: 12px 0 0; }
  .quiz-option { text-align: left; font: inherit; font-weight: 650; font-size: 1.05rem; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .quiz-option:hover:not(:disabled) { border-color: var(--canopy); }
  .quiz-option.right { border-color: var(--canopy); background: var(--canopy-soft); }
  .quiz-option.wrong { border-color: #B3322A; background: #FBE3E0; }
  .quiz-feedback { font-weight: 700; margin: 10px 0; }
  .quiz-feedback.right { color: var(--canopy); }
  .quiz-feedback.wrong { color: #B3322A; }
  .quiz-score { font-family: var(--display, inherit); font-size: 3rem; font-weight: 800; color: var(--canopy); line-height: 1; }
</style>
{% endblock %}
{% block content %}
<section class="hero">
  <p class="lesson-kicker">{{ ui.crumb_course }}</p>
  <h1>{{ ui.practice_title }}</h1>
  <p class="lead">{{ ui.practice_lead }}</p>
</section>

<section class="lesson-quiz" id="quiz" aria-live="polite">
  <div id="quiz-root">
    <p id="practice-status"></p>
    <button class="btn" type="button" id="practice-start" hidden>{{ ui.practice_start }}</button>
  </div>
</section>

<nav class="lesson-nav" style="margin: 26px 0 8px">
  <a class="btn secondary" href="{{ course_href }}">{{ ui.practice_back }}</a>
</nav>

{{ js_ui|json_script:"course-ui" }}
{% include "marketing/_course_quiz_js.html" %}
<script>
(function () {
  var ui = JSON.parse(document.getElementById('course-ui').textContent);
  var SRS = window.CourseQuiz.SRS;
  var store = {};
  try { store = JSON.parse(localStorage.getItem(ui.srs_key) || '{}') || {}; } catch (e) {}
  var due = SRS.due(store, Date.now(), 1000).length;
  var status = document.getElementById('practice-status'), button = document.getElementById('practice-start');
  var data = { week: 0, kind: 'review', birds: [], review_birds: [], known_species: [], lookalikes: [],
               quiz: { questions: 10, kind: 'photo', review_questions: 10, modes: { photo: 5, photo_sound: 3, sound: 2 } } };
  var quiz = window.CourseQuiz.start({
    root: document.getElementById('quiz-root'), data: data, ui: ui, nextHref: '{{ course_href|escapejs }}',
    week: 0, srsKey: ui.srs_key, apiBase: ui.api_base, practice: true
  });
  // Signed-in learners may have due birds from another device; the quiz syncs first, so offer it anyway.
  status.textContent = due ? ui.due_count.replace('{n}', due) : ui.none_due;
  button.hidden = false;
  button.onclick = quiz.run;
})();
</script>
{% endblock %}
